name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema==0.38.0
      - name: Validate the schema itself
        run: check-jsonschema --check-metaschema registry.schema.json
      - name: Validate registry.json against registry.schema.json
        run: check-jsonschema --schemafile registry.schema.json registry.json
